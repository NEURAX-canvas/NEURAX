name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Only this job links against MLIR; the UI job has no use for the prefixes.
    env:
      LLVM_SYS_180_PREFIX: /usr/lib/llvm-18
      MLIR_SYS_180_PREFIX: /usr/lib/llvm-18
    steps:
      - uses: actions/checkout@v4

      # `ubuntu-latest` ships with Android SDK, .NET, GHC and a few other
      # toolchains this workspace never touches — tens of GB gone before a
      # single dependency is installed. Restoring the cargo cache below, then
      # apt-installing the LLVM 18 + MLIR dev packages (themselves several
      # GB), was enough to exceed what was left and fail the job with "No
      # space left on device" partway through setup — a runner-disk problem,
      # not a build one, but indistinguishable from one in the job log.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/dotnet /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install LLVM 18 / MLIR
        run: |
          # LLVM 18 + Polly come from the official apt.llvm.org repo
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" | sudo tee /etc/apt/sources.list.d/llvm-18.list
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev libmlir-18-dev mlir-18-tools libpolly-18-dev
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # `target` used to be part of this cache too. It grew to 4+ GB over the
      # life of the repository — on its own enough to tip the job into the
      # "No space left on device" failure above once the LLVM/MLIR packages
      # were also on disk. The registry and git caches below are what actually
      # save time (skipping re-fetching every crate); losing the incremental
      # `target` cache costs a slower rebuild, not a failed job.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # v2: the old key's cache blob bundled `target` into the same
          # archive as the two paths above. Reusing that key here would have
          # restored the same 4+ GB regardless of the shorter `path` list.
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          # Without a fallback, any Cargo.lock change misses the cache outright
          # and rebuilds the whole workspace — MLIR included — from scratch.
          restore-keys: ${{ runner.os }}-cargo-v2-

      # `cargo test` compiles libs, bins and examples itself, so a preceding
      # `cargo build --workspace` only paid for the same work twice.
      - name: Build and test workspace
        run: cargo test --workspace

      - name: Lint (clippy)
        # NOTE: legacy clippy debt is tracked as warnings (not `-D warnings`) so
        # the build stays green. Pay down debt incrementally and re-enable
        # `-D warnings` once the workspace is warning-free.
        run: cargo clippy --workspace --no-deps

      - name: Format check
        run: cargo fmt --check

  ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: neurax-ui/package-lock.json

      # `npm ci` installs the locked tree; `npm install` was free to resolve a
      # different one than the machine that produced the lockfile.
      - name: Install UI deps
        working-directory: neurax-ui
        run: npm ci

      - name: Test UI
        working-directory: neurax-ui
        run: npm test

      - name: Build UI
        working-directory: neurax-ui
        run: npm run build