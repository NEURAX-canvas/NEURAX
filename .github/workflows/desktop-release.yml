name: Build desktop installers

# Not on every push. Building three operating systems takes tens of minutes and
# produces artefacts nobody looks at unless a release is being cut, so this runs
# on a version tag or when asked for by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            # One bundle running natively on both Apple silicon and Intel.
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            build-essential curl wget file libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            neurax-desktop/target
          key: ${{ matrix.platform }}-desktop-${{ hashFiles('neurax-desktop/Cargo.toml') }}
          restore-keys: ${{ matrix.platform }}-desktop-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: neurax-ui/package-lock.json

      - name: Install UI deps
        working-directory: neurax-ui
        run: npm ci

      # `tauri-action` runs the config's `beforeBuildCommand`, which builds the
      # frontend in desktop mode, then bundles for the host platform.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: neurax-desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: NEURAX ${{ github.ref_name }}
          releaseBody: "Desktop builds of NEURAX. See the changelog for what is in this release."
          releaseDraft: true
          args: ${{ matrix.args }}
