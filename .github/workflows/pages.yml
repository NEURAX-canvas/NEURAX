name: Publish documentation to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Build the mdBook and publish the static site to the `gh-pages` branch,
# which GitHub Pages serves from. This mirrors the classic mdBook -> gh-pages
# workflow and avoids the deploy-pages API queuing issue on this repository.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          curl -LsSf https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin
          mdbook --version

      # book.toml declares a non-optional `[preprocessor.mermaid]` — every
      # diagram in the book depends on this binary being on PATH. Its
      # absence here was silent: `mdbook build` exits non-zero, but nothing
      # surfaced that failure anywhere a human would see it, so the last
      # three pushes to `book/**` (back to 2026-08-31) never actually
      # updated the published site even though each run reported "failure"
      # in the Actions tab.
      - name: Install mdbook-mermaid
        run: |
          curl -LsSf https://github.com/badboy/mdbook-mermaid/releases/download/v0.17.1/mdbook-mermaid-v0.17.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin
          mdbook-mermaid --version

      - name: Build book
        run: mdbook build book

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: book/book
          publish_branch: gh-pages
          force_orphan: true
