[workspace]
members = [
    "neurax-core",
    "neurax-parser",
    "neurax-ir",
    "neurax-formulas",
    "neurax-hardware-db",
    "neurax-tui",
    "neurax-service",
]
# `neurax-desktop` links against the platform webview (WebKitGTK on Linux,
# WebView2 on Windows, WKWebView on macOS). Making it a member would mean
# `cargo build --workspace` — and so CI, and anyone working on the compiler —
# required those system libraries. It is its own workspace and reaches the
# crates it needs by path, so there is still one copy of the compiler.
#
# `neurax-ir-poc` is a one-off architectural comparison experiment (see its
# README) — deliberately excluded so it never becomes a silent dependency of
# the product or a thing CI has to keep green. Build/run it explicitly with
# `--manifest-path neurax-ir-poc/Cargo.toml`.
#
# `neurax-mlir` is excluded for the same reason: nothing in the workspace
# imports `neurax_mlir::` anywhere (verified — grepped every other crate),
# and its own FLOPs/param "computation" (`compiler.rs::calculate_total_*`)
# just calls back into `neurax_ir`, so it adds zero independent value while
# forcing an LLVM-18 toolchain onto every `cargo build --workspace` for a
# crate nothing uses. Kept in the repo (its melior/MLIR lowering is real,
# not hollow — see its own tests) in case it becomes the basis of a real
# native cross-check pass later; build/test it explicitly with
# `--manifest-path neurax-mlir/Cargo.toml` until then.
exclude = ["neurax-desktop", "neurax-ir-poc", "neurax-mlir"]
resolver = "2"

[workspace.dependencies]
ahash = "0.8"
anyhow = "1"
approx = "0.5"
chrono = { version = "0.4", features = ["serde"] }
color-eyre = "0.6"
criterion = "0.5"
crossterm = { version = "0.28", features = ["event-stream"] }
dashmap = "6"
evalexpr = "11"
indexmap = "2"
itertools = "0.13"
melior = "0.18"
num_cpus = "1"
once_cell = "1"
parking_lot = "0.12"
petgraph = "0.6"
proptest = "1"
ratatui = "0.28"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"

[workspace.lints.rust]
unsafe_code = "allow"
unused_crate_dependencies = "allow"
