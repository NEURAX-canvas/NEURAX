[package]
name = "neurax-cli"
version = "0.1.0"
edition = "2021"
description = "CLI interface for NEURAX"
license = "MIT"
repository = "https://github.com/rustnew/NEURAX"
homepage = "https://rustnew.github.io/NEURAX/"
readme = "README.md"
keywords = ["ml", "compiler", "cli", "neural", "analysis"]
categories = ["command-line-utilities"]

[[bin]]
name = "neurax"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
neurax-core = { version = "0.1.1", path = "../neurax-core" }
neurax-parser = { version = "0.1.1", path = "../neurax-parser" }
neurax-ir = { version = "0.1.1", path = "../neurax-ir" }
neurax-mlir = { version = "0.1.1", path = "../neurax-mlir", optional = true }

[features]
default = []
# Enable the MLIR backend (requires LLVM 18: set LLVM_SYS_180_PREFIX / MLIR_SYS_180_PREFIX / TABLEGEN_180_PREFIX)
mlir = ["dep:neurax-mlir"]
