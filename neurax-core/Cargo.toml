[package]
name = "neurax-core"
version = "0.1.0"
edition = "2021"
description = "Core pipeline and orchestration for NEURAX"
license = "MIT"
repository = "https://github.com/rustnew/NEURAX"
homepage = "https://rustnew.github.io/NEURAX/"
readme = "README.md"
keywords = ["ml", "compiler", "neural", "pipeline", "analysis"]
categories = ["compilers", "science"]

[dependencies]
# Sérialisation
serde = { workspace = true }
serde_json = { workspace = true }

# Erreurs
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Parallélisme
rayon = { workspace = true }

# Temps
chrono = { workspace = true }

# Performance
ahash = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
smallvec = { workspace = true }
indexmap = { workspace = true }
itertools = { workspace = true }
once_cell = { workspace = true }

# Async runtime (for streaming broadcast channels)
tokio = { workspace = true }

# Crates internes
neurax-parser = { version = "0.1.0", path = "../neurax-parser" }
neurax-ir = { version = "0.1.0", path = "../neurax-ir" }
neurax-formulas = { version = "0.1.0", path = "../neurax-formulas" }
neurax-hardware-db = { version = "0.1.0", path = "../neurax-hardware-db" }

[dev-dependencies]
approx = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }

[features]
mlir = []

[lints]
workspace = true
