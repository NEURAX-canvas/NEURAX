[project]
name = "neurax-mcp"
version = "0.1.0"
description = "MCP server for NEURAX neural architecture compiler"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0",
    "httpx>=0.27.0",
]

[project.scripts]
neurax-mcp = "neurax_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
