[package]
name = "neurax-parser"
version = "0.7.2"
edition = "2021"
description = "JSON parsing for NEURAX universal format"
license = "MIT"
repository = "https://github.com/rustnew/NEURAX"
homepage = "https://rustnew.github.io/NEURAX/"
readme = "README.md"
keywords = ["parser", "json", "neural", "architecture", "ml"]
categories = ["parser-implementations"]

[dependencies]
# Sérialisation
serde = { workspace = true }
serde_json = { workspace = true }

# Erreurs
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Expression evaluator
evalexpr = { workspace = true }

# Performance
ahash = { workspace = true }
indexmap = { workspace = true }
itertools = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
