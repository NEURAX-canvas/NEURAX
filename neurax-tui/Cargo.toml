[package]
name = "neurax-tui"
version = "0.11.0"
edition = "2021"
description = "Terminal User Interface for Neurax IR model compilation visualization"
license = "MIT"
repository = "https://github.com/rustnew/NEURAX"
homepage = "https://rustnew.github.io/NEURAX/"
readme = "README.md"
keywords = ["tui", "terminal", "ml", "compiler", "visualization"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
neurax-core = { version = "0.11.0", path = "../neurax-core" }
neurax-ir = { version = "0.11.0", path = "../neurax-ir" }
neurax-parser = { version = "0.11.0", path = "../neurax-parser" }

ratatui = { workspace = true }
crossterm = { workspace = true }
tokio = { workspace = true }
color-eyre = { workspace = true }
unicode-width = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[dependencies.uuid]
version = "1.0"
features = ["v4"]

[[bin]]
name = "neurax-tui"
path = "src/main.rs"
